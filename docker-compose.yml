services:
  invoice-manager:
    build: .
    container_name: invoice-manager
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      INVOICE_CLOUD: "1"
      INVOICE_DATA_DIR: /app/data
      INVOICE_TEMPLATE: /app/发票模板.xlsx
      INVOICE_USER: ${INVOICE_USER:-admin}
      INVOICE_PASSWORD: ${INVOICE_PASSWORD:?请先在 .env 设置 INVOICE_PASSWORD}
    ports:
      - "8765:8765"
    volumes:
      - invoice-data:/app/data

volumes:
  invoice-data:
    name: invoice-manager-data
